 cebolla:{n:'Cebolla',d:150,kc:.85,sed:0,win:'xcgggccccxxx',s:{helada:'baja',granizo:'media',inund:'alta',sequia:'media'},note:'Se pudre con exceso de agua; prefiere la época seca con riego.',agua:'Media',frio:'Aguanta helada',harvestTxt:'Cosecha'},
 zanahoria:{n:'Zanahoria',d:110,kc:.85,sed:0,win:'xcggggcccxxx',s:{helada:'baja',granizo:'baja',inund:'alta',sequia:'media'},note:'Aguanta el frío; con suelo encharcado la raíz se deforma.',agua:'Media',frio:'Aguanta helada',harvestTxt:'Cosecha'},
 lechuga:{n:'Lechuga',d:80,kc:.9,sed:1,win:'xcggcccggcxx',s:{helada:'media',granizo:'alta',inund:'alta',sequia:'alta'},note:'Hoja tierna: el granizo la rompe y el exceso de agua la pudre. Necesita riego frecuente. No la riegues con agua del río.',agua:'Frecuente',frio:'Aguanta helada leve',harvestTxt:'Cosecha',market:'Si todos cosechan la misma semana, el precio en La Cancha baja: escalonar ayuda.'}
};
const SECO=true;
const SV=(id)=>`<svg class="i"><use href="icons.svg#${id}"/></svg>`;
let crop=new URLSearchParams(location.search).get('c')||'alfalfa'; if(!C[crop])crop='alfalfa';
let sow=NOW;

function months(m,d){const out=[];const n=Math.max(1,Math.round(d/30));for(let k=0;k<=n;k++)out.push((m+k)%12);return out;}
function ranges(win){const out=[];let a=-1;for(let i=0;i<=12;i++){if(i<12&&win[i]==='g'){if(a<0)a=i;}else if(a>=0){out.push([a,i-1]);a=-1;}}return out;}
const rtxt=([a,b])=>a===b?MES[a]:`${MES[a]} a ${MES[b]}`;
function verdict(c,m){let w=c.win[m];const dry=SECO&&c.sed&&w==='g'&&[7,8,9,10,11].includes(m);if(dry)w='c';return{w,dry};}
function risks(c,m){const ms=months(m,c.d);return Object.entries(H).map(([k,z])=>({z,r:Math.max(...ms.map(x=>z.v[x]))*W[c.s[k]]})).filter(x=>x.r>=.7).sort((a,b)=>b.r-a.r).slice(0,2);}

function render(){
  const c=C[crop], rg=ranges(c.win);
  document.getElementById('hero').src='img/'+crop+'.webp'; document.getElementById('hero').alt=c.n;
  document.getElementById('t').textContent=c.n;
  const M3=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  const DIMX=[31,28,31,30,31,30,31,31,30,31,30,31];
  const fd=(d)=>`${d.getDate()} ${M3[d.getMonth()]}`;
  const sep='<span class="or">o también</span>';
  const rgN=rg.filter(([a,b])=>NOW>=a&&NOW<=b).concat(rg.filter(([a])=>a>NOW),rg).slice(0,1);
  document.getElementById('sowTxt').innerHTML=rgN.map(([a,b])=>`<span class="rg">${1} ${M3[a]} – ${DIMX[b]} ${M3[b]}</span>`).join(sep);
  document.getElementById('harTxt').innerHTML=rgN.map(([a,b])=>{const s0=new Date(2026,a,1),s1=new Date(2026,b,DIMX[b]);return `<span class="rg">${fd(new Date(s0.getTime()+c.d*864e5))} – ${fd(new Date(s1.getTime()+c.d*864e5))}</span>`;}).join(sep);
  const {w,dry}=verdict(c,sow), rs=risks(c,sow);
  const lab={g:['Buena época','check'],c:['Con cuidado','alert'],x:['No es buena época','alert']}[w];
  let reason = w==='g' ? 'Es buena época en tu zona.' : dry ? 'Es buena época, pero este año hay poca agua en La Angostura.' : w==='c' ? 'Se puede, pero con riesgo.' : `Mejor espera a ${MES[rg[0]?.[0]??0]}.`;
  document.getElementById('now').innerHTML=`<div class="nh"><h2>${sow===NOW?'Si siembras ahora':'Si siembras en '+MES[sow]}</h2><span class="verdict ${w}">${SV(lab[1])}${lab[0]}</span></div>
    <p class="reason">${reason}</p>
    ${rs.length?`<ul class="risks">${rs.map(x=>`<li><span class="ic" style="background:${x.z.soft};color:${x.z.col}">${SV(x.z.ic)}</span>${x.z.n}</li>`).join('')}</ul>`:''}`;
  if(document.getElementById('months'))document.getElementById('months').innerHTML=MES.map((m,i)=>{const v=verdict(c,i).w;const col=v==='g'?'var(--field)':v==='c'?'#E0A21B':'var(--nowater)';return `<button aria-pressed="${i===sow}" data-m="${i}"><i style="background:${col}"></i>${m.slice(0,3)}</button>`;}).join('');
  document.getElementById('extra').innerHTML=`<div class="facts2"><div>${SV('drop')}<span><small>Agua</small><b>${c.agua}</b></span></div><div>${SV('frost')}<span><small>Frío</small><b>${c.frio}</b></span></div></div>
    ${c.market?`<p class="mk">${SV('store')}<span>${c.market}</span></p>`:''}`;
}
// ---------- calendario para elegir fecha ----------
function shiftMonth(dir){
  const gEl=document.getElementById('grid');
  view=new Date(view.getFullYear(),view.getMonth()+dir,1);
  gEl.style.transition='none';gEl.style.transform=`translateX(${dir*40}%)`;gEl.style.opacity='0';
  drawCal();
  requestAnimationFrame(()=>requestAnimationFrame(()=>{gEl.style.transition='transform 260ms cubic-bezier(0.23,1,0.32,1),opacity 200ms ease';gEl.style.transform='';gEl.style.opacity='';}));
}
(()=>{let x0=null,y0=0,t0=0;const area=()=>document.getElementById('grid');
  document.addEventListener('pointerdown',e=>{if(!e.target.closest('#grid'))return;x0=e.clientX;y0=e.clientY;t0=performance.now();});
  document.addEventListener('pointermove',e=>{if(x0===null)return;const dx=e.clientX-x0;if(Math.abs(dx)>Math.abs(e.clientY-y0))area().style.transform=`translateX(${dx*.35}px)`;});
  const end=e=>{if(x0===null)return;const dx=e.clientX-x0,v=Math.abs(dx)/(performance.now()-t0);x0=null;
    if(Math.abs(dx)>60||(Math.abs(dx)>20&&v>.3)){window._swiped=true;setTimeout(()=>window._swiped=false,50);shiftMonth(dx<0?1:-1);}else{area().style.transition='transform 200ms ease';area().style.transform='';}};
  document.addEventListener('pointerup',end);document.addEventListener('pointercancel',end);
})();
const TODAYD=new Date(2026,10,16);
let view=new Date(2026,10,1), start=null;
const dsheet=document.getElementById('dsheet');
const MESC=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const sameDay=(a,b)=>a&&b&&a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate();
const harvestOf=(d)=>new Date(d.getTime()+C[crop].d*864e5);
function dayVerdict(d){const c=C[crop];let w=c.win[d.getMonth()];const dry=SECO&&c.sed&&w==='g'&&[7,8,9,10,11].includes(d.getMonth());return{w,dry};}
function drawCal(){
  const c=C[crop],y=view.getFullYear(),m=view.getMonth();
  document.getElementById('ds-s').textContent=c.n;
  document.getElementById('mtitle').textContent=`${MESC[m][0].toUpperCase()+MESC[m].slice(1)} ${y}`;
  const first=(new Date(y,m,1).getDay()+6)%7, days=new Date(y,m+1,0).getDate(), h=start?harvestOf(start):null;
  let g='';for(let i=0;i<first;i++)g+='<span class="cell"></span>';
  for(let d=1;d<=days;d++){const t=new Date(y,m,d),past=t<TODAYD,{w}=dayVerdict(t);
    const isS=sameDay(t,start),isH=sameDay(t,h),inR=start&&h&&t>=start&&t<=h;
    const col=(first+d-1)%7;
    const band=inR?['cell','band',isS?'bs':'',isH?'be':'',col===0&&!isS?'rl':'',col===6&&!isH?'rr':'',d===1&&!isS?'rl':'',d===days&&!isH?'rr':''].filter(Boolean).join(' '):'cell';
    const cls=['dd',w==='g'&&!past?'good':'',w==='x'&&!past?'bad':'',past?'past':'',isS?'sel':'',isH?'har':'',sameDay(t,TODAYD)?'today':''].filter(Boolean).join(' ');
    g+=`<span class="${band}"><button class="${cls}" data-day="${d}" ${past?'disabled':''} aria-label="${d} de ${MESC[m]}${w==='g'?', día bueno':w==='x'?', día malo':''}">${d}</button></span>`;}
  for(let k=first+days;k<42;k++)g+='<span class="cell"></span>';
  document.getElementById('grid').innerHTML=g;
  document.getElementById('lg').innerHTML='<span><i class="g"></i>Buenos</span><span><i class="b"></i>Malos</span>'+(start?'<span><i class="bd"></i>Tu cultivo</span>':'');
  const r=document.getElementById('pickres');
  if(!start){r.innerHTML='<p class="hint2">Toca el día en que quieres sembrar.</p>';return;}
  const v=dayVerdict(start),lab=v.w==='g'?(v.dry?['ok','Buena fecha','Este año hay poca agua en La Angostura.']:['ok','Buena fecha','Es buena época para sembrar en tu zona.']):v.w==='c'?['mid','Con cuidado','Se puede, pero hay riesgo de clima en esos meses.']:['bad','Mala fecha','Mejor elige un día en verde.'];
  r.innerHTML=`<div class="res ${lab[0]}"><b>${lab[1]}</b><span>${lab[2]}</span></div>
    <div class="span3">
      <button class="sj${view.getMonth()===start.getMonth()&&view.getFullYear()===start.getFullYear()?' on':''}" id="tosow"><small>Siembra</small><b>${start.getDate()} ${MESC[start.getMonth()].slice(0,3)}</b><em>›</em></button>
      <button class="hj${view.getMonth()===h.getMonth()&&view.getFullYear()===h.getFullYear()?' on':''}" id="tohar"><small>Cosecha</small><b>${h.getDate()} ${MESC[h.getMonth()].slice(0,3)}</b><em>›</em></button>
      <div class="mid"><b>${C[crop].d}</b><small>días</small></div>
    </div>
    <button class="btn primary" id="plan"><svg class="i"><use href="icons.svg#plus"/></svg>Agregar a mis cultivos</button>
    <a class="btn ghost" href="rotar.html?c=${crop}&h=${h.getFullYear()}-${h.getMonth()+1}-${h.getDate()}"><svg class="i"><use href="icons.svg#refresh"/></svg>Planificar rotación</a>`;
}
document.addEventListener('click',e=>{
  if(e.target.closest('#pick')){view=new Date(TODAYD.getFullYear(),TODAYD.getMonth(),1);start=new Date(TODAYD);drawCal();dsheet.showModal();return;}
  if(e.target.closest('#mprev')){shiftMonth(-1);return;}
  if(e.target.closest('#mnext')){shiftMonth(1);return;}
  const dd=e.target.closest('[data-day]');if(dd&&!dd.disabled&&!window._swiped){start=new Date(view.getFullYear(),view.getMonth(),Number(dd.dataset.day));drawCal();return;}
  if(e.target.closest('#reset')){start=null;view=new Date(TODAYD.getFullYear(),TODAYD.getMonth(),1);drawCal();return;}
  if(e.target.closest('#tosow')){view=new Date(start.getFullYear(),start.getMonth(),1);drawCal();return;}
  if(e.target.closest('#tohar')){const h=harvestOf(start);view=new Date(h.getFullYear(),h.getMonth(),1);drawCal();return;}
  if(e.target===dsheet||e.target.closest('#dsheet [data-close]')){dsheet.close();return;}
  if(e.target.closest('#plan')){const c=C[crop],h=harvestOf(start);dsheet.close();window.say&&say(`${c.n} agregada: siembra ${start.getDate()} ${MESC[start.getMonth()].slice(0,3)}, cosecha aprox. ${h.getDate()} ${MESC[h.getMonth()].slice(0,3)}.`);return;}

  const m=e.target.closest('[data-m]'); if(m){sow=Number(m.dataset.m);render();document.getElementById('now').scrollIntoView({behavior:'smooth',block:'start'});return;}
});
render();
if(DEMO==='#fecha'){view=new Date(2026,10,1);start=new Date(2026,10,20);drawCal();dsheet.showModal();}
</script>
