          type: string
          format: date-time
        alertas:
          type: array
          items:
            $ref: '#/components/schemas/Alert'
      required:
      - actualizado_en
      - alertas
    Rotation:
      type: object
      properties:
        id:
          type: string
        secuencia:
          type: array
          items:
            anyOf:
            - type: string
            - type: 'null'
        actual_tipica:
          type: boolean
        meses_sin_cultivo:
          type: integer
        puntaje:
          type: object
          properties:
            agua:
              type: integer
              minimum: 1
              maximum: 3
            tierra:
              type: integer
              minimum: 1
              maximum: 3
            forraje:
              type: integer
              minimum: 1
              maximum: 3
            vender:
              type: integer
              minimum: 1
              maximum: 3
        etiquetas:
          type: array
          items:
            type: array
            prefixItems:
            - type: string
            - type: string
              enum:
              - bien
              - mal
              - neutro
            minItems: 2
            maxItems: 2
        por_que:
          type: string
        bueno:
          type: array
          items:
            type: string
        riesgos:
          type: array
          items:
            type: string
        falta_saber:
          type: array
          items:
            type: string
        evidencia:
          type: array
          items:
            type: object
            properties:
              codigo:
                type: string
              fuente:
                type: string
                enum:
                - nasa_power
                - nasa_imerg
                - nasa_smap
                - nasa_geos
                - srtm
                - gamc_wms
                - riego_n1
                - eventos_historicos
                - catalogo_cultivos
                - reportes
            required:
            - codigo
            - fuente
        confianza:
          type: string
          enum:
          - alta
          - media
          - baja
