      - actualizado_en
      - nivel_pct
      - estado
    HistoryDay:
      type: object
      properties:
        fecha_utc:
          type: string
          format: date
        pmm:
          anyOf:
          - type: number
          - type: 'null'
        pmm_producto:
          type: string
          enum:
          - final
          - late
        pmm_revision:
          type: string
        pmm_calidad:
          type: object
          properties:
            intervalos_validos:
              type: integer
          additionalProperties: true
        fecha:
          type: string
          format: date
        tmin:
          type: number
        tmax:
          type: number
      required:
      - fecha
    History:
      type: object
      properties:
        dias:
          type: array
          items:
            $ref: '#/components/schemas/HistoryDay'
        fuente:
          type: array
          items:
            type: string
            enum:
            - nasa_power
            - nasa_imerg
            - nasa_smap
            - nasa_geos
            - srtm
            - gamc_wms
            - riego_n1
            - eventos_historicos
            - catalogo_cultivos
            - reportes
      required:
      - dias
    Alert:
      type: object
      properties:
        id:
          type: string
        tipo:
          type: string
          enum:
          - helada
          - granizo
          - lluvia_fuerte
          - desborde
          - sequia
          - represa_baja
          - temporada
        fecha_evento:
          type: string
          format: date
        momento:
          type: string
        valor:
          type: object
          properties: {}
          additionalProperties: true
        confianza:
          type: string
          enum:
          - alta
          - media
          - baja
        volver_a_avisar:
          type: string
