        mes:
          type: integer
          minimum: 1
          maximum: 12
        pmm_total:
          type: number
        tmin:
          type: number
        tmax:
          type: number
        p_helada:
          type: number
        p_granizo:
          type: number
        p_desborde:
          type: number
        p_poca_agua:
          type: number
