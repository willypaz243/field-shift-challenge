      - mes
    Climatology:
      type: object
      properties:
        zone_id:
          type: string
        periodo:
          type: object
          properties: {}
          additionalProperties: true
        meses:
          type: array
          items:
            $ref: '#/components/schemas/ClimatologyMonth'
        fuente:
          type: array
          items:
            type: string
            enum:
            - nasa_power
            - nasa_imerg
            - nasa_smap
            - nasa_geos
            - srtm
            - gamc_wms
            - riego_n1
            - eventos_historicos
            - catalogo_cultivos
            - reportes
      required:
      - zone_id
      - meses
    Reservoir:
      type: object
      properties:
        actualizado_en:
          type: string
          format: date-time
        nivel_pct:
          type: number
        volumen_hm3:
          type: number
        estado:
          type: string
          enum:
          - normal
          - bajo
          - critico
        fuente:
          type: array
          items:
            type: string
            enum:
            - nasa_power
            - nasa_imerg
            - nasa_smap
            - nasa_geos
            - srtm
            - gamc_wms
            - riego_n1
            - eventos_historicos
            - catalogo_cultivos
            - reportes
