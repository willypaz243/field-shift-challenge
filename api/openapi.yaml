          type: string
          format: date
        tipo:
          type: string
        lugar:
          type: string
        valor:
          type: object
          properties: {}
          additionalProperties: true
        fuente:
          type: string
      required:
      - fecha
      - tipo
    ZoneMap:
      type: object
