              type: integer
            periodo_dias:
              type: integer
            direccion:
              type: string
        capas:
          type: object
          properties:
            sin_agua:
              type: object
              description: GeoJSON object (WGS84, lon/lat order)
              additionalProperties: true
            inundable:
              type: object
              description: GeoJSON object (WGS84, lon/lat order)
              additionalProperties: true
        historial:
          type: array
          items:
            $ref: '#/components/schemas/HistoryEvent'
      required:
      - actualizado_en
      - capas
    Sync:
      type: object
      properties:
