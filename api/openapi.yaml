      - cosecha
      - resultado
    Plan:
      type: object
      properties:
        zone_id:
          type: string
        rotacion_id:
          type: string
        siembra:
          type: string
          format: date
      required:
      - zone_id
      - rotacion_id
      - siembra
    Created:
      type: object
      properties:
        id:
          type: string
      required:
      - id

